<title>Moonie Books</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working ledger. Sticky header with cash position and tabs; each tab is one job (see, enter, report). */
:root {
  --bg: #f6f5f9;
  --panel: #ffffff;
  --ink: #1d1a26;
  --muted: #625d70;
  --line: #e2dfea;
  --accent: #6a32a8;
  --accent-soft: #efe7f8;
  --ok: #1f7a4d;
  --warn: #9a6200;
  --bad: #b3261e;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15131b; --panel: #1e1b26; --ink: #ece9f3; --muted: #a29cb2; --line: #332f3e;
  --accent: #b88bf0; --accent-soft: #2c2340; --ok: #5fc48e; --warn: #e2a845; --bad: #f08a80; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #15131b; --panel: #1e1b26; --ink: #ece9f3; --muted: #a29cb2; --line: #332f3e;
  --accent: #b88bf0; --accent-soft: #2c2340; --ok: #5fc48e; --warn: #e2a845; --bad: #f08a80; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1180px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-block: 14px 8px; }
h1 { font-family: var(--font-display); font-weight: 650; font-size: 1.6rem; letter-spacing: -0.01em; margin: 0; }
h1 span { color: var(--accent); }
.cashline { color: var(--muted); font-size: 0.85rem; }
.cashline b { font-family: var(--font-num); font-weight: 500; color: var(--ink); font-size: 1rem; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; padding-bottom: 0; scrollbar-width: none; }
nav.tabs button { all: unset; cursor: pointer; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
main { padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
section[data-tab] { display: flex; flex-direction: column; gap: 20px; }
h2 { font-family: var(--font-display); font-weight: 650; font-size: 1.15rem; margin: 0; text-wrap: balance; }
h3 { font-size: 0.95rem; font-weight: 600; margin: 0; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 70ch; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .l { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.kpi .v { font-family: var(--font-num); font-size: 1.45rem; font-weight: 500; }
.kpi .s { font-size: 0.8rem; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.card .note { color: var(--muted); font-size: 0.8rem; margin: -6px 0 0; }
.tbox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--font-num); white-space: nowrap; }
tr.total td { font-weight: 600; border-top: 1px solid var(--ink); }
tr.grand td { font-weight: 600; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); }
tr.sec td { font-weight: 600; color: var(--accent); border-bottom: none; padding-top: 14px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
tr.sub td:first-child { padding-left: 22px; }
tr.check td { color: var(--muted); font-size: 0.8rem; border-bottom: none; }
td.neg { color: var(--bad); }
.pill { display: inline-block; font-size: 0.72rem; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.confirmed { color: var(--ok); } .pill.estimate { color: var(--warn); } .pill.check { color: var(--bad); } .pill.manual { color: var(--accent); }
.arrow { color: var(--muted); }
.statement table { min-width: 640px; }
.statement td:first-child { min-width: 15rem; }
.statement th.n { min-width: 7.5rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--r); padding: 3px; gap: 2px; }
.seg button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: var(--r); padding: 8px 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 2px 10px; font-size: 0.8rem; font-weight: 500; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
form.entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 0.8rem; font-weight: 500; color: var(--muted); }
.field input, .field select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 0; }
.field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.field .hint { font-size: 0.75rem; color: var(--muted); }
.formfoot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.post { font-size: 0.8rem; color: var(--muted); font-family: var(--font-num); }
.toast { color: var(--ok); font-weight: 500; }
.err { color: var(--bad); font-weight: 500; }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters input, .filters select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 0; }
.filters input { flex: 1 1 14rem; max-width: 22rem; }
.notes { max-width: 72ch; display: flex; flex-direction: column; gap: 14px; }
.notes p { margin: 0; }
.notes li { margin-bottom: 6px; }
.flowbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.flowbar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
@media (max-width: 560px) { .hide-sm { display: none; } }
@media (prefers-reduced-motion: no-preference) { section[data-tab] { animation: fade .2s ease-out; } @keyframes fade { from { opacity: .4; } to { opacity: 1; } } }
</style>
